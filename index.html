<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paco's Island</title>
<meta name="description" content="A daily answer game. Paco the iguana takes you across the bay from Puerto Vallarta to Yelapa. The fewer people who give your answer, the farther you go.">
<meta name="theme-color" content="#095565">
<meta property="og:title" content="Paco's Island">
<meta property="og:description" content="Seven questions a day. The fewer people who give your answer, the farther Paco takes you.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/PPFuji-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/PPNeueMontreal-Book.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page">
  <div class="scene" id="scene"></div>
  <div class="trip-bar" id="tripBar" hidden>
    <p class="trip-where" id="tripWhere"></p>
    <p class="trip-score"><span id="tripScore">0</span> <span class="unit">points</span></p>
  </div>

  <section id="title" class="screen" aria-labelledby="titleHead">
    <h1 id="titleHead" class="wordmark"></h1>
    <p class="lede" id="intro"></p>
    <fieldset class="trips" id="trips">
      <legend id="tripLegend"></legend>
    </fieldset>
    <button class="btn primary" id="startBtn" type="button"></button>
    <details class="how">
      <summary id="howHead"></summary>
      <ul id="howList"></ul>
    </details>
    <p class="credit" id="credit"></p>
  </section>

  <section id="play" class="screen" hidden aria-labelledby="qText">
    <div class="q-top">
      <p class="q-count" id="qCount"></p>
      <ol class="squares" id="squares" aria-hidden="true"></ol>
    </div>
    <h2 class="q-text" id="qText" tabindex="-1"></h2>
    <form id="answerForm" class="answer" autocomplete="off" novalidate>
      <label for="answerInput" id="answerLabel"></label>
      <div class="answer-row">
        <input id="answerInput" name="answer" type="text" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button class="btn primary" id="answerBtn" type="submit"></button>
      </div>
    </form>
    <div class="clock" id="clock">
      <div class="clock-track"><div class="clock-fill" id="clockFill"></div></div>
      <p class="clock-num" id="clockNum" aria-hidden="true"></p>
    </div>
    <p class="note" id="note" role="status" aria-live="polite"></p>
    <div class="result" id="result" hidden>
      <p class="result-name" id="resultName"></p>
      <p class="result-pts" id="resultPts"></p>
      <p class="result-rarer" id="resultRarer"></p>
      <button class="btn primary" id="nextBtn" type="button"></button>
    </div>
  </section>

  <section id="end" class="screen" hidden aria-labelledby="endHead">
    <h1 class="end-head" id="endHead" tabindex="-1"></h1>
    <p class="lede" id="endTotal"></p>
    <p class="end-note" id="endNext"></p>
    <p class="end-note" id="endUnlock"></p>
    <div class="share">
      <pre class="share-text" id="shareText"></pre>
      <div class="share-actions">
        <button class="btn primary" id="copyBtn" type="button"></button>
        <button class="btn quiet" id="moveBtn" type="button"></button>
      </div>
      <p class="note" id="copyNote" role="status" aria-live="polite"></p>
    </div>
    <h2 class="sub" id="answersHead"></h2>
    <ol class="answers" id="answers"></ol>
    <p class="note" id="estNote"></p>
    <p class="credit" id="comeBack"></p>
  </section>
</main>

<dialog id="moveDialog" aria-labelledby="moveHead">
  <h2 id="moveHead"></h2>
  <p id="moveBody"></p>
  <input id="moveLink" type="text" readonly aria-labelledby="moveHead">
  <div class="share-actions">
    <button class="btn primary" id="copyLinkBtn" type="button"></button>
    <button class="btn quiet" id="closeMove" type="button"></button>
  </div>
  <p class="note" id="moveNote" role="status" aria-live="polite"></p>
</dialog>

<dialog id="importDialog" aria-labelledby="importHead">
  <h2 id="importHead"></h2>
  <p id="importBody"></p>
  <div class="share-actions">
    <button class="btn primary" id="importYes" type="button"></button>
    <button class="btn quiet" id="importNo" type="button"></button>
  </div>
</dialog>

<script src="vendor/pixi.min.js"></script>
<script src="js/data.js"></script>
<script src="js/prompts.js"></script>
<script src="js/engine.js"></script>
<script src="js/copy.js"></script>
<script src="js/art.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
