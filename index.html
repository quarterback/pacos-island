<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paco's Island</title>
<meta name="description" content="A daily trivia game. The rarer your answer, the farther Paco the iguana takes you.">
<meta name="theme-color" content="#095565">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paco's Island">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pacoisland.fun/">
<meta property="og:site_name" content="Paco's Island">
<meta property="og:title" content="Paco's Island">
<meta property="og:description" content="A daily trivia game. The rarer your answer, the farther Paco the iguana takes you.">
<meta property="og:image" content="https://pacoisland.fun/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Paco the iguana rides a boat across a bay past a beach town and a striped lighthouse, while his twin Mario flies overhead on Esmeralda, a green macaw.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Paco's Island">
<meta name="twitter:description" content="A daily trivia game. The rarer your answer, the farther Paco the iguana takes you.">
<meta name="twitter:image" content="https://pacoisland.fun/icons/og.png">
<meta name="twitter:image:alt" content="Paco the iguana rides a boat across a bay past a beach town and a striped lighthouse, while his twin Mario flies overhead on Esmeralda, a green macaw.">
<link rel="canonical" href="https://pacoisland.fun/">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/PPFuji-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/PPNeueMontreal-Book.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section id="splash" class="splash" aria-labelledby="splashWord" hidden>
  <canvas id="splashArt" class="splash-art" aria-hidden="true"></canvas>
  <div class="splash-box">
    <h1 id="splashWord" class="splash-word"></h1>
    <p id="splashLine" class="splash-line"></p>
    <button id="splashStart" class="btn primary wide splash-start" type="button"></button>
    <button id="splashHow" class="text-link splash-how" type="button"></button>
    <p id="splashCredit" class="splash-credit"></p>
  </div>
</section>
<main class="page">
  <div class="scene" id="scene">
    <div class="hud" id="hud" hidden>
      <p class="hud-where" id="tripWhere"></p>
      <p class="hud-score" id="tripScore">0</p>
    </div>
    <button class="music-toggle" id="musicBtn" type="button" aria-pressed="false"></button>
  </div>

  <section id="title" class="screen" aria-labelledby="titleHead">
    <h1 id="titleHead" class="wordmark" tabindex="-1"></h1>
    <p class="lede" id="intro"></p>
    <fieldset class="trips modes" id="levels">
      <legend id="levelLegend"></legend>
      <div class="mode"><input type="radio" name="level" id="level-paco" value="paco"><label for="level-paco" id="levelPaco"></label><span class="mode-note" id="levelPacoNote"></span></div>
      <div class="mode"><input type="radio" name="level" id="level-mario" value="mario"><label for="level-mario" id="levelMario"></label><span class="mode-note" id="levelMarioNote"></span></div>
      <div class="mode"><input type="radio" name="level" id="level-vacation" value="vacation"><label for="level-vacation" id="levelVacation"></label><span class="mode-note" id="levelVacationNote"></span></div>
    </fieldset>
    <fieldset class="trips modes" id="modes" hidden>
      <legend id="modeLegend"></legend>
      <div class="mode"><input type="radio" name="mode" id="mode-daily" value="daily"><label for="mode-daily" id="modeDaily"></label><span class="mode-note" id="modeDailyNote"></span></div>
      <div class="mode"><input type="radio" name="mode" id="mode-endless" value="endless"><label for="mode-endless" id="modeEndless"></label><span class="mode-note" id="modeEndlessNote"></span></div>
    </fieldset>
    <fieldset class="trips" id="trips">
      <legend id="tripLegend"></legend>
    </fieldset>
    <button class="btn primary wide" id="startBtn" type="button"></button>
    <button class="text-link" id="scoresBtn" type="button"></button>
    <button class="text-link" id="leaveBtn" type="button" hidden></button>
    <details class="how" id="how">
      <summary id="howHead"></summary>
      <ul id="howList"></ul>
    </details>
    <p class="credit" id="credit"></p>
  </section>

  <section id="play" class="screen" hidden aria-labelledby="qText">
    <div class="q-top">
      <p class="q-count" id="qCount"></p>
      <ol class="squares" id="squares" aria-hidden="true"></ol>
    </div>
    <h2 class="q-text" id="qText" tabindex="-1"></h2>
    <form id="answerForm" class="answer" autocomplete="off" novalidate>
      <label for="answerInput" id="answerLabel"></label>
      <div class="answer-row">
        <input id="answerInput" name="answer" type="text" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button class="btn primary" id="answerBtn" type="submit"></button>
      </div>
    </form>
    <div class="clock" id="clock">
      <div class="clock-track"><div class="clock-fill" id="clockFill"></div></div>
      <p class="clock-num" id="clockNum" aria-hidden="true"></p>
    </div>
    <p class="note" id="note" role="status" aria-live="polite"></p>
    <button class="btn stumped" id="stumpedBtn" type="button"></button>
    <div class="result" id="result" hidden>
      <p class="result-name" id="resultName"></p>
      <p class="result-pts" id="resultPts" aria-hidden="true"></p>
      <p class="result-split"><span id="resultRarity"></span> <span id="resultSpeed" class="speed"></span></p>
      <p class="sr" id="resultSay" role="status" aria-live="polite"></p>
      <div class="cameo" id="cameo" hidden>
        <div class="cameo-who"><span class="cameo-art" id="cameoMarioArt"></span><p><strong id="cameoMarioName">Mario</strong> <span id="cameoMario"></span></p></div>
        <div class="cameo-who parrot"><p><strong id="cameoParrotName"></strong> <span id="cameoParrot"></span></p><span class="cameo-art" id="cameoParrotArt"></span></div>
      </div>
      <button class="btn primary wide" id="nextBtn" type="button"></button>
    </div>
  </section>

  <section id="menu" class="screen" hidden aria-labelledby="menuHead">
    <p class="q-count" id="menuCount"></p>
    <p class="treat-answer"><span id="menuAnswer"></span> <span class="treat-pts" id="menuPts"></span></p>
    <div class="menu-card">
      <h2 class="menu-head" id="menuHead" tabindex="-1"></h2>
      <p class="menu-say" id="menuSay"></p>
      <h3 class="menu-sec" id="menuDrinksHead"></h3>
      <ul class="menu-list" id="menuDrinks"></ul>
      <h3 class="menu-sec" id="menuPlatesHead"></h3>
      <ul class="menu-list" id="menuPlates"></ul>
    </div>
  </section>

  <section id="treat" class="screen" hidden aria-labelledby="treatHead">
    <p class="q-count" id="treatCount"></p>
    <div class="treat-art"><span class="treat-item" id="treatItem"></span></div>
    <h2 class="treat-head" id="treatHead" tabindex="-1"></h2>
    <p class="treat-note" id="treatNote"></p>
    <div class="cameo-who treat-say"><p><strong id="treatWho"></strong> <span id="treatSay"></span></p></div>
    <button class="btn primary wide" id="treatBtn" type="button"></button>
  </section>

  <section id="end" class="screen" hidden aria-labelledby="endHead">
    <button class="text-link home-link" id="homeBtn" type="button"></button>
    <h1 class="end-head" id="endHead" tabindex="-1"></h1>
    <p class="end-note" id="endNext"></p>

    <h2 class="sub" id="sheetHead"></h2>
    <ol class="sheet" id="sheet"></ol>
    <dl class="totals">
      <div id="rarityRow"><dt id="rarityLabel"></dt><dd id="rarityTotal"></dd></div>
      <div id="speedRow"><dt id="speedLabel"></dt><dd id="speedTotal"></dd></div>
      <div id="islandRow" hidden><dt id="islandLabel"></dt><dd id="islandTotal"></dd></div>
      <div class="grand"><dt id="totalLabel"></dt><dd id="grandTotal"></dd></div>
      <div id="timeRow"><dt id="timeLabel"></dt><dd id="timeTotal"></dd></div>
    </dl>
    <p class="beat" id="endBeat"></p>
    <p class="end-note" id="endLifetime"></p>
    <p class="end-note" id="endUnlock"></p>
    <p class="keep-tip" id="endKeep" hidden></p>
    <button class="text-link" id="endScoresBtn" type="button"></button>

    <div class="share" id="share">
      <pre class="share-text" id="shareText"></pre>
      <p class="mark-key" id="markKey"></p>
      <div class="share-actions">
        <button class="btn primary" id="copyBtn" type="button"></button>
        <button class="btn quiet" id="moveBtn" type="button"></button>
      </div>
      <p class="note" id="copyNote" role="status" aria-live="polite"></p>
    </div>

    <div class="earlier" id="earlier" hidden>
      <h2 class="sub" id="earlierHead"></h2>
      <ul class="earlier-list" id="earlierList"></ul>
    </div>

    <div class="suggest" id="suggest" hidden>
      <p class="end-note" id="suggestText"></p>
      <button class="btn quiet wide" id="suggestBtn" type="button"></button>
    </div>

    <div class="round-actions" id="roundActions" hidden>
      <button class="btn primary wide" id="againBtn" type="button"></button>
      <button class="btn quiet wide" id="changeTripBtn" type="button"></button>
      <button class="text-link" id="leaveEndBtn" type="button"></button>
    </div>

    <p class="credit" id="comeBack"></p>
  </section>

  <section id="scores" class="screen" hidden aria-labelledby="scoresHead">
    <button class="text-link home-link" id="scoresBack" type="button"></button>
    <h1 class="end-head" id="scoresHead" tabindex="-1"></h1>
    <p class="end-note" id="scoresNone"></p>
    <dl class="totals" id="scoresStats"></dl>
    <h2 class="sub" id="scoresDaysHead"></h2>
    <ol class="sheet" id="scoresList"></ol>
    <p class="keep-tip" id="scoresKeep" hidden></p>
    <button class="btn quiet wide" id="backupBtn" type="button"></button>
  </section>
</main>

<dialog id="moveDialog" aria-labelledby="moveHead">
  <h2 id="moveHead"></h2>
  <p id="moveBody"></p>
  <input id="moveLink" type="text" readonly aria-labelledby="moveHead">
  <div class="share-actions">
    <button class="btn primary" id="copyLinkBtn" type="button"></button>
    <button class="btn quiet" id="closeMove" type="button"></button>
  </div>
  <p class="note" id="moveNote" role="status" aria-live="polite"></p>
</dialog>

<dialog id="importDialog" aria-labelledby="importHead">
  <h2 id="importHead"></h2>
  <p id="importBody"></p>
  <div class="share-actions">
    <button class="btn primary" id="importYes" type="button"></button>
    <button class="btn quiet" id="importNo" type="button"></button>
  </div>
</dialog>

<script src="vendor/pixi.min.js"></script>
<script src="js/rarity.js"></script>
<script src="js/locked-days.js"></script>
<script src="js/data.js"></script>
<script src="js/prompts.js"></script>
<script src="js/engine.js"></script>
<script src="js/copy.js"></script>
<script src="js/music.js"></script>
<script src="js/splash.js"></script>
<script src="js/art.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
