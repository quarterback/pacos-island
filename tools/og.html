<!doctype html>
<!-- Builds icons/og.png, the 1200 x 630 share card. Run: python3 tools/og.py -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Fuji; src: url(../fonts/PPFuji-Bold.woff2) format('woff2'); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #095565; }
canvas { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; }
.word { position: absolute; left: 56px; bottom: 40px; margin: 0; padding: 18px 28px 14px; background: #0D2340; border-radius: 12px; color: #FFC43A; font: 96px/1 Fuji, sans-serif; text-shadow: 0 5px 0 #000; }
</style></head><body>
<canvas id="c" width="1200" height="630"></canvas>
<p class="word">Paco’s Island</p>
<script src="../js/rarity.js"></script><script src="../js/data.js"></script><script src="../js/prompts.js"></script><script src="../js/engine.js"></script>
<script src="../js/art.js"></script>
<script>
  const X = Number(new URLSearchParams(location.search).get('x') || 0);
  const g = document.getElementById('c').getContext('2d'); g.scale(2, 2);
  const strip = Art.coast();
  // The strip is 240 tall and the card 315 at this scale, so the top sky row is repeated above it.
  g.drawImage(strip, X, 0, 600, 1, 0, 0, 600, 76);
  g.drawImage(strip, X, 0, 600, 240, 0, 75, 600, 240);
  const b = Art.boat(0);
  g.drawImage(b, 400, 75 + Art.COAST.horizon + 55 - b.height + 9);
  document.title = 'ready';
</script></body></html>
